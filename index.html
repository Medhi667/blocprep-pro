<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlocPrep Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    .container { display: flex; flex-direction: column; height: 100vh; background: white; }
    .header { background: #2c3e50; color: white; padding: 16px; }
    .header h1 { font-size: 24px; margin-bottom: 12px; }
    .tabs { display: flex; gap: 8px; margin-top: 12px; }
    .tab-btn { padding: 10px 16px; background: #ecf0f1; border: none; cursor: pointer; border-radius: 4px; font-weight: 600; }
    .tab-btn.active { background: #3498db; color: white; }
    .content { flex: 1; padding: 20px; overflow: auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏥 BlocPrep Pro</h1>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('checklist')">✓ Checklists</button>
        <button class="tab-btn" onclick="switchTab('planning')">📅 Planning</button>
        <button class="tab-btn" onclick="switchTab('chat')">💬 Chat</button>
      </div>
    </div>
    <div class="content">
      <div class="tab-content active" id="checklist"><h2>Checklists</h2><p>Fonctionne! ✓</p></div>
      <div class="tab-content" id="planning"><h2>Planning</h2><p>Fonctionne! ✓</p></div>
      <div class="tab-content" id="chat"><h2>Chat</h2><p>Fonctionne! ✓</p></div>
    </div>
  </div>
  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
